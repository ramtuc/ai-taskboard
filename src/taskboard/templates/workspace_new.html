{% extends "base.html" %}
{% block title %}ワークスペース追加 · AI Taskboard{% endblock %}
{% block content %}
<h1>ワークスペースを追加</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/workspaces/new" class="form">
  <label>名前 <input name="name" value="{{ values.name or '' }}" required maxlength="80"></label>
  <label>slug（URL・英小文字/数字/ハイフン。空なら名前から生成）<input name="slug" value="{{ values.slug or '' }}" pattern="[a-z0-9][a-z0-9-]{0,39}" placeholder="例: blog"></label>
  <label>説明 <input name="description" value="{{ values.description or '' }}" maxlength="200"></label>
  <label>AI からの見え方
    <select name="ai_policy">
      {% for p in AI_POLICIES %}<option value="{{ p }}" {% if p == values.ai_policy %}selected{% endif %}>{{ AI_POLICY_LABELS[p] }}</option>{% endfor %}
    </select>
  </label>
  <p><button type="submit" class="btn primary">作成</button> <a class="btn" href="/">戻る</a></p>
</form>
{% endblock %}
