[project]
name = "ai-taskboard"
version = "0.2.0"
description = "Local web board where humans and AI manage candidates and leftovers together (FastAPI + SQLite + htmx)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "markdown-it-py==4.2.0",
]

[project.scripts]
taskboard = "taskboard.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
